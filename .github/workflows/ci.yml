name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  server:
    name: Go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Test
        run: go test ./...

  frontend:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.com
      VITE_CLINIC_SLUG: default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build admin
        run: npm run build --workspace=apps/admin

      - name: Build app
        run: npm run build --workspace=apps/app

      - name: Build mobile
        run: npm run build --workspace=@you-vet/mobile

      - name: Build docs portal
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build --workspace=@you-vet/docs-portal
