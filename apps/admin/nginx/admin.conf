# ── HTTP → редирект на HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.bospur.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → статика ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.bospur.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.bospur.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.bospur.ru/privkey.pem;

    root /var/www/vp-bot-admin;
    index index.html;

    # SPA — все маршруты отдаём index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статических ассетов (хеш в имени — можно кешировать надолго)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
