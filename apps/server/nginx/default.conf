# Хостовый nginx на VPS (не внутри Docker).
# ── HTTP → редирект на HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name api.bospur.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → Go на localhost:8080 ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.bospur.ru;

    ssl_certificate     /etc/letsencrypt/live/api.bospur.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bospur.ru/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
