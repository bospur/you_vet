# ── HTTP → редирект на HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name docs.snzbeachvolleyball25.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → статика документации ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name docs.snzbeachvolleyball25.ru;

    ssl_certificate     /etc/letsencrypt/live/docs.snzbeachvolleyball25.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.snzbeachvolleyball25.ru/privkey.pem;

    root /var/www/you-vet-docs;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
