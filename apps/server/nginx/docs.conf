# ── HTTP → редирект на HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    server_name docs.snzbeachvolleyball25.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → статика документации ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name docs.snzbeachvolleyball25.ru;

    ssl_certificate     /etc/letsencrypt/live/docs.snzbeachvolleyball25.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.snzbeachvolleyball25.ru/privkey.pem;

    root /var/www/you-vet-docs;
    index index.html;

    # Старые *.html → SPA (301, чтобы не путать закладки)
    location = /roadmap.html { return 301 /roadmap; }
    location = /project-for-devs.html { return 301 /project-for-devs; }
    location = /mobile.html { return 301 /mobile; }
    location = /rustore-app.html { return 301 /rustore-app; }
    location = /booking-for-clinic.html { return 301 /booking-for-clinic; }
    location = /phase-5-appointments.html { return 301 /phase-5-appointments; }
    location = /audit.html { return 301 /; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
